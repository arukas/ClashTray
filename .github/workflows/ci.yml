name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ClashTray.sln

      - name: Build
        run: dotnet build ClashTray.sln --configuration Release --property:Platform=x64 --no-restore

      - name: Official Mihomo interoperability gate
        shell: pwsh
        run: .\packaging\Test-OfficialMihomo.ps1 -Configuration Release

      - name: Test (integration)
        run: dotnet test tests/ClashTray.IntegrationTests/ClashTray.IntegrationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=integration-test-results.trx"

      - name: Test (core, with coverage)
        run: dotnet test tests/ClashTray.Core.Tests/ClashTray.Core.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=core-test-results.trx" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Coverage gate (ClashTray.Core)
        shell: pwsh
        run: .\packaging\Test-CoverageGate.ps1 -CoverageDirectory tests/ClashTray.Core.Tests/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

      - name: Upload official Mihomo gate result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-mihomo-test-results
          path: ${{ runner.temp }}/official-mihomo-results/*.trx
          if-no-files-found: ignore
