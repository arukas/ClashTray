name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix, for example 1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true

jobs:
  release:
    name: Build and publish x64 installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ClashTray.sln

      - name: Build and test
        run: |
          dotnet build ClashTray.sln --configuration Release --property:Platform=x64 --no-restore
          dotnet test ClashTray.sln --configuration Release --property:Platform=x64 --no-build

      - name: Build compressed variants
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $version = if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION_INPUT)) { $env:RELEASE_REF.TrimStart('v') } else { $env:RELEASE_VERSION_INPUT.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Release version must look like 1.2.3 or 1.2.3-alpha.1; received '$version'." }
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE 'release-output'
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null
          foreach ($variant in @('Full', 'NoCore', 'Framework')) {
            & .\packaging\Build-EXE.ps1 -Configuration Release -PackageVersion $version -Variant $variant -OutputDirectory (Join-Path $outputRoot $variant)
            if ($LASTEXITCODE -ne 0) { throw "Build-EXE.ps1 failed for $variant." }
          }
          $files = Get-ChildItem -LiteralPath $outputRoot -Recurse -File -Include '*.exe', '*.sha256'
          if ($files.Count -lt 6) { throw "Expected three installers and three checksum files, found $($files.Count)." }
          $checksumLines = foreach ($file in (Get-ChildItem -LiteralPath $outputRoot -Recurse -File -Filter '*.exe' | Sort-Object FullName)) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath (Join-Path $outputRoot 'SHA256SUMS.txt') -Value $checksumLines -Encoding ascii
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ClashTray-${{ env.RELEASE_VERSION }}-win-x64
          path: release-output/**
          if-no-files-found: error

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          $tag = if ($env:RELEASE_REF -match '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { $env:RELEASE_REF } else { "v$env:RELEASE_VERSION" }
          $assets = Get-ChildItem -LiteralPath 'release-output' -Recurse -File -Include '*.exe', '*.sha256', 'SHA256SUMS.txt' | Select-Object -ExpandProperty FullName
          $releaseArgs = @($tag, '--target', $env:GITHUB_SHA, '--title', "ClashTray $env:RELEASE_VERSION", '--generate-notes')
          if ($env:RELEASE_VERSION -match '-') { $releaseArgs += '--prerelease' }
          $releaseArgs += $assets
          gh release create @releaseArgs
